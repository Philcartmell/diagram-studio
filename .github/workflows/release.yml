name: Release

# Push a v<version> tag (see RELEASING.md): stages the engine on npm with
# provenance, then creates the GitHub release from the changelog. The staged
# version goes live only when a maintainer approves it on npmjs.com with 2FA:
# the trusted publisher may stage, never publish directly.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.15 or later (trusted publishing, npm stage)
        run: npm install -g npm@11
      - name: The tag matches every version and has changelog notes
        run: node ../tools/release.mjs check "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      # A version that is staged but not yet approved can't be staged again:
      # approve or reject it before re-running this job.
      - name: Stage on npm for approval (skipped when this version is already published)
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "diagram-studio@$version" version >/dev/null 2>&1; then
            echo "diagram-studio@$version is already on npm; skipping."
          else
            npm stage publish . --provenance --access public
            echo "::notice::diagram-studio@$version is staged. Approve it on npmjs.com (or npm stage list diagram-studio, then npm stage approve <id>) to make it live."
          fi
      - name: GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/release.mjs notes "$GITHUB_REF_NAME" > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
