<text id="ds-subtitle" data-role="subtitle" font-family="Kalam, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5C574F"><tspan x="48" y="107">What the board should weigh before committing capital</tspan></text>
<path id="ds-header-rule" data-role="decoration" d="M48 128C404.5 128, 760 127.5, 1232 128" fill="none" stroke="#8C857A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text id="narrative-heading" data-role="header" font-family="Kalam, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#C0392B"><tspan x="48" y="165.5">Benefits</tspan></text>
<path id="point-1--bullet-1" data-role="marker" d="M50 190.5A2.5 2.5 0 1 1 55 190.5A2.5 2.5 0 1 1 50 190.5Z" fill="#C0392B"/>
<text id="point-1--lead" data-role="label" font-family="Kalam, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2A28"><tspan x="64" y="194">Later cut-off</tspan></text>
<text id="point-1--text" data-role="label" font-family="Kalam, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5C574F"><tspan x="64" y="212">Robotic picking lets both sites ship next-day orders placed up to 10 pm.</tspan></text>
<path id="point-2--bullet-1" data-role="marker" d="M50 238.5A2.5 2.5 0 1 1 55 238.5A2.5 2.5 0 1 1 50 238.5Z" fill="#C0392B"/>
<text id="point-2--lead" data-role="label" font-family="Kalam, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2A28"><tspan x="64" y="242">Fewer errors</tspan></text>
<text id="point-2--text" data-role="label" font-family="Kalam, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5C574F"><tspan x="64" y="260">Scan-to-pack checks remove most of the mis-picks behind customer returns.</tspan></text>
<path id="point-3--bullet-1" data-role="marker" d="M50 286.5A2.5 2.5 0 1 1 55 286.5A2.5 2.5 0 1 1 50 286.5Z" fill="#C0392B"/>
<text id="point-3--lead" data-role="label" font-family="Kalam, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2A28"><tspan x="64" y="290">Supplier risk</tspan></text>
<text id="point-3--text" data-role="label" font-family="Kalam, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5C574F"><tspan x="64" y="308">Few vendors can deliver at this scale; the plan depends on ours keeping its build slots.</tspan></text>
<path id="point-4--bullet-1" data-role="marker" d="M50 334.5A2.5 2.5 0 1 1 55 334.5A2.5 2.5 0 1 1 50 334.5Z" fill="#C0392B"/>
<text id="point-4--lead" data-role="label" font-family="Kalam, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2A28"><tspan x="64" y="338">Payback risk</tspan></text>
<text id="point-4--text" data-role="label" font-family="Kalam, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5C574F"><tspan x="64" y="356">Fit-out costs fall in the first two years while the savings build over five.</tspan></text>
