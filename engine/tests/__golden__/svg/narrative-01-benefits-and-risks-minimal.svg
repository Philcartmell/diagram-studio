<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ds-svg-title ds-svg-desc" data-generator="diagram-studio 1.0.0" data-type="narrative" data-theme="minimal" data-altitude="executive">
<title id="ds-svg-title">Automating the two largest warehouses pays back in four years, if we manage two risks</title>
<desc id="ds-svg-desc">What the board should weigh before committing capital</desc>
<rect id="ds-background" data-role="background" width="1280" height="720" fill="#FFFFFF"/>
<text id="ds-title" data-role="title" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#1F2328"><tspan x="48" y="75.5">Automating the two largest warehouses pays back in four years, if we manage two risks</tspan></text>
<text id="ds-subtitle" data-role="subtitle" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#57606A"><tspan x="48" y="108">What the board should weigh before committing capital</tspan></text>
<text id="narrative-heading" data-role="header" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#C2410C"><tspan x="48" y="167">Benefits</tspan></text>
<path id="point-1--bullet-1" data-role="marker" d="M50 190.5A2.5 2.5 0 1 1 55 190.5A2.5 2.5 0 1 1 50 190.5Z" fill="#C2410C"/>
<text id="point-1--lead" data-role="label" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328"><tspan x="64" y="195">Later cut-off</tspan></text>
<text id="point-1--text" data-role="label" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#57606A"><tspan x="64" y="213">Robotic picking lets both sites ship next-day orders placed up to 10 pm.</tspan></text>
<path id="point-2--bullet-1" data-role="marker" d="M50 238.5A2.5 2.5 0 1 1 55 238.5A2.5 2.5 0 1 1 50 238.5Z" fill="#C2410C"/>
<text id="point-2--lead" data-role="label" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328"><tspan x="64" y="243">Fewer errors</tspan></text>
<text id="point-2--text" data-role="label" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#57606A"><tspan x="64" y="261">Scan-to-pack checks remove most of the mis-picks behind customer returns.</tspan></text>
<path id="point-3--bullet-1" data-role="marker" d="M50 286.5A2.5 2.5 0 1 1 55 286.5A2.5 2.5 0 1 1 50 286.5Z" fill="#C2410C"/>
<text id="point-3--lead" data-role="label" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328"><tspan x="64" y="291">Supplier risk</tspan></text>
<text id="point-3--text" data-role="label" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#57606A"><tspan x="64" y="309">Few vendors can deliver at this scale; the plan depends on ours keeping its build slots.</tspan></text>
<path id="point-4--bullet-1" data-role="marker" d="M50 334.5A2.5 2.5 0 1 1 55 334.5A2.5 2.5 0 1 1 50 334.5Z" fill="#C2410C"/>
<text id="point-4--lead" data-role="label" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328"><tspan x="64" y="339">Payback risk</tspan></text>
<text id="point-4--text" data-role="label" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#57606A"><tspan x="64" y="357">Fit-out costs fall in the first two years while the savings build over five.</tspan></text>
</svg>
