<path id="point-1--bullet-1" data-role="marker" d="M50 190.5A2.5 2.5 0 1 1 55 190.5A2.5 2.5 0 1 1 50 190.5Z" fill="#FFC24B"/>
<text id="point-1--lead" data-role="label" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#F2F6FB"><tspan x="64" y="196">Later cut-off</tspan></text>
<text id="point-1--text" data-role="label" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B8CCE3"><tspan x="64" y="214">Robotic picking lets both sites ship next-day orders placed up to 10 pm.</tspan></text>
<path id="point-2--bullet-1" data-role="marker" d="M50 238.5A2.5 2.5 0 1 1 55 238.5A2.5 2.5 0 1 1 50 238.5Z" fill="#FFC24B"/>
<text id="point-2--lead" data-role="label" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#F2F6FB"><tspan x="64" y="244">Fewer errors</tspan></text>
<text id="point-2--text" data-role="label" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B8CCE3"><tspan x="64" y="262">Scan-to-pack checks remove most of the mis-picks behind customer returns.</tspan></text>
<path id="point-3--bullet-1" data-role="marker" d="M50 286.5A2.5 2.5 0 1 1 55 286.5A2.5 2.5 0 1 1 50 286.5Z" fill="#FFC24B"/>
<text id="point-3--lead" data-role="label" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#F2F6FB"><tspan x="64" y="292">Supplier risk</tspan></text>
<text id="point-3--text" data-role="label" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B8CCE3"><tspan x="64" y="310">Few vendors can deliver at this scale; the plan depends on ours keeping its build slots.</tspan></text>
<path id="point-4--bullet-1" data-role="marker" d="M50 334.5A2.5 2.5 0 1 1 55 334.5A2.5 2.5 0 1 1 50 334.5Z" fill="#FFC24B"/>
<text id="point-4--lead" data-role="label" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#F2F6FB"><tspan x="64" y="340">Payback risk</tspan></text>
<text id="point-4--text" data-role="label" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#B8CCE3"><tspan x="64" y="358">Fit-out costs fall in the first two years while the savings build over five.</tspan></text>
